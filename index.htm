<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vex TAV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>

<body>
    <div id="app" class="container">
        <h1>Vex Team Availability Viewer</h1>
        <warning>{{message}}</warning>
        <!-- form with eventCode and Submit to call vue updateSortedList funciton -->

        <form @submit.prevent="updateAll">
            <div class="mb-3">
              <span class="mr-5 pr-5">Event Code</span>
              <input style="margin-left: 8px; margin-right: 8px;" type="text" class="ml-5 pl-5 mr-5 pr-5" id="eventCode" v-model="eventCode">
              <button type="submit" class="btn btn-primary btn-sm">Submit</button>
            </div>
          </form>
          <div>
            <input type="checkbox" id="checkbox" v-model="reverse" @change="reverseTeamList">
            <label for="checkbox1" style="margin-right: 20px;">reverse</label>
            <input type="checkbox" id="checkbox2" v-model="showSelected" @change="updateSortedTeamList">
            <label for="checkbox2">showSelected?</label>
          </div>
        <!-- a table with sortTeamList -->
        <table class="table">
          
            <thead>
                <tr>
                    <th scope="col">Team</th>
                    <th scope="col">Matches left until next match</th>
                    <th scope="col">selected</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="team in displayTeamList">
                    <td>{{team.number}}</td>
                    
                    <td>{{team.time}}</td>
                    <td>
                      <input type="checkbox" v-model="team.selected" @change = "addTeam(team)">
                    </td>
                </tr>
            </tbody>
        </table>
        <aside>
            <style>
                .subtle {
                    color: #888;
                    font-size: 0.8em;
                }
            </style>
            <p class="subtle">Created and maintained by Nikhil from team 3050X.</p>

            <form @submit.prevent="addTeamButton">
                <div>
                  <label for="teamInput">Add Team:</label>
                  <input id="teamInput" type="text" v-model="teamInput">
                  <button type="submit">Add</button>
                </div>
              </form>
            </aside>
            <div>
                <h3>Added Teams:</h3>
                <ul>
                  <li v-for="(team, index) in selectedTeamList" :key="index">
                    {{ team }} <button type="button" @click="removeTeam(index)">Remove</button>
                  </li>
                </ul>
              </div>
            </aside>
        </aside>
    </div>
</body>

</html>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="js/vueapp.js?v=2" type="module"></script>
